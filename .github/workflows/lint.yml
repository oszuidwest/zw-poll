---
name: Lint

on:
  push:
    branches: [main]
    paths:
      - '**/*.php'
      - '.github/actions/**'
      - '.github/workflows/lint.yml'
      - 'src/**/*.js'
      - 'src/**/*.css'
      - 'composer.json'
      - 'composer.lock'
      - 'phpcs.xml'
      - 'phpcs.xml.dist'
      - 'phpstan.neon'
      - 'phpstan.neon.dist'
      - 'phpstan-bootstrap.php'
      - 'languages/**'
      - 'scripts/pot.sh'
  pull_request:
    paths:
      - '**/*.php'
      - '.github/actions/**'
      - '.github/workflows/lint.yml'
      - 'src/**/*.js'
      - 'src/**/*.css'
      - 'composer.json'
      - 'composer.lock'
      - 'phpcs.xml'
      - 'phpcs.xml.dist'
      - 'phpstan.neon'
      - 'phpstan.neon.dist'
      - 'phpstan-bootstrap.php'
      - 'languages/**'
      - 'scripts/pot.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl
          coverage: none
          tools: composer:v2, cs2pr

      - name: Validate PHP syntax
        run: >-
          find . -path './vendor' -prune -o -path './node_modules' -prune -o
          -path './dist' -prune -o
          -name '*.php' -type f -print0 | xargs -0 -n1 php --syntax-check

      - name: Validate composer.json
        if: matrix.php == '8.4'
        run: composer validate --strict --no-check-publish

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist --no-interaction --optimize-autoloader

      - name: Audit Composer dependencies
        if: matrix.php == '8.4'
        run: composer security

      - name: PHP_CodeSniffer
        run: |
          vendor/bin/phpcs -q --report=checkstyle \
            --runtime-set ignore_warnings_on_exit 1 \
            | cs2pr --graceful-warnings

      - name: PHPStan
        run: vendor/bin/phpstan analyse --error-format=checkstyle | cs2pr

      - name: WordPress plugin check
        if: matrix.php == '8.4'
        uses: ./.github/actions/plugin-check

  translations:
    name: Translations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          coverage: none
          tools: wp-cli

      - name: Verify POT is up-to-date
        run: scripts/pot.sh --check
