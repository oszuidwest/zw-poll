---
name: Dependency security

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/security.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/npm-audit.mjs'
      - 'docs/npm-audit.md'
  pull_request:
    paths:
      - '.github/workflows/security.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/npm-audit.mjs'
      - 'docs/npm-audit.md'
  workflow_dispatch:
  schedule:
    - cron: '24 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm ci

      - name: Audit shipped dependencies
        run: npm run security:production

      - name: Audit development tooling
        run: npm run security
