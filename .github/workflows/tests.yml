---
name: Tests

on:
  push:
    branches: [main]
    paths:
      - '**/*.php'
      - 'src/**'
      - '.github/workflows/tests.yml'
      - 'composer.json'
      - 'composer.lock'
      - 'package.json'
      - 'package-lock.json'
      - 'patchwork.json'
      - 'phpunit.xml.dist'
      - 'playground/**'
      - 'playwright.config.ts'
      - 'scripts/check-coverage.php'
      - 'tests/**'
  pull_request:
    paths:
      - '**/*.php'
      - 'src/**'
      - '.github/workflows/tests.yml'
      - 'composer.json'
      - 'composer.lock'
      - 'package.json'
      - 'package-lock.json'
      - 'patchwork.json'
      - 'phpunit.xml.dist'
      - 'playground/**'
      - 'playwright.config.ts'
      - 'scripts/check-coverage.php'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpunit:
    name: PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: ${{ matrix.php == '8.4' && 'xdebug' || 'none' }}
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run PHPUnit
        if: matrix.php != '8.4'
        run: composer test

      - name: Run PHPUnit with coverage
        if: matrix.php == '8.4'
        run: composer coverage

      - name: Upload coverage report
        if: ${{ matrix.php == '8.4' && !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: php-coverage
          path: coverage.xml
          retention-days: 14
          if-no-files-found: error

  playwright:
    name: Playwright (WordPress Playground)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        wordpress: ['6.9', 'latest']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Start WordPress Playground
        env:
          WP_VERSION: ${{ matrix.wordpress }}
        run: nohup npm run playground -- --wp="$WP_VERSION" > playground.log 2>&1 &

      - name: Wait for Playground to be ready
        run: |
          ready_url="http://127.0.0.1:9400/poll-demo/"
          for attempt in $(seq 1 60); do
            code=$(curl -L -s -o playground-ready.html -w '%{http_code}' --max-time 5 "$ready_url" || true)
            case "$code" in
              2*|3*)
                # Keep this check in sync with the seeded poll question in playground/blueprint.json.
                if grep -qF "Wat drink jij het liefst op de redactie?" playground-ready.html; then
                  echo "Playground ready (HTTP $code)"
                  exit 0
                fi
                ;;
            esac
            echo "Waiting for Playground at $ready_url (attempt $attempt/60, HTTP ${code:-curl failed})"
            sleep 5
          done
          echo "Playground did not become ready in time"
          tail -n 200 playground.log
          if [ -f playground-ready.html ]; then
            echo "Last Playground response snippet:"
            head -c 500 playground-ready.html
            echo
          fi
          exit 1

      - name: Run E2E tests
        env:
          PLAYGROUND_URL: http://127.0.0.1:9400
        run: npm run test:e2e

      - name: Upload report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-wp-${{ matrix.wordpress }}
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore
